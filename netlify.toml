[build]
  publish = "public"

  [build.environment]
    SECRETS_SCAN_OMIT_PATHS = "public/vendor/**"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/entrena/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
