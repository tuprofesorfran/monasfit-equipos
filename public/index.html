<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a66a8">
<title>MonasFIT Salud</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app móvil de una columna. Cabecera fija con equipo y pestañas; sesiones como filas con la hora a la izquierda. */
:root{
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#f3f8fe; --surface:#ffffff; --surface-2:#e9f1fa; --line:#d3e0ee;
  --fg:#1b2b3c; --muted:#5a6b7d;
  --accent:#2a66a8; --accent-soft:#dcebfa; --accent-ink:#ffffff;
  --sun:#f6a65a; --sun-soft:#fff3c7;
  --val:#a35410; --val-soft:#fde8d2;
  --danger:#b3261e; --danger-soft:#fbe0dd; --ok:#27764a;
  --c-free:#d6eafb; --c-part:#fff1bd; --c-full:#fcd9b4; --c-na:#eef0f4; --c-ink:#1b3550; --c-na-ink:#7b8494;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1722; --surface:#17212f; --surface-2:#1f2c3d; --line:#2b3b50;
  --fg:#e8eef6; --muted:#9fb0c4;
  --accent:#7fb8f0; --accent-soft:#1c3350; --accent-ink:#0b1b2c;
  --sun:#f5b36b; --sun-soft:#3a3315;
  --val:#f5b36b; --val-soft:#3a2a14;
  --danger:#ff9087; --danger-soft:#3b1b18; --ok:#7fd488;
  --c-free:#1d3a57; --c-part:#4a4217; --c-full:#55361a; --c-na:#1c2430; --c-ink:#e8eef6; --c-na-ink:#8794a6;
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);
  padding-block:0 4rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:1.9rem;letter-spacing:.01em}
h2{font-size:1.5rem;margin:1.4rem 0 .6rem}
h3{font-size:1.15rem}
h4{font-size:1.1rem;margin-bottom:.5rem}
p{margin:.3rem 0}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 .15rem;font-weight:600}

.top::before{content:"";display:block;height:5px;margin:-.7rem -16px .6rem;background:linear-gradient(90deg,#5aa9e6,#f6a65a 55%,#ffd666)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:-16px;padding:.7rem 16px 0}
.brand{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.who{display:flex;flex-direction:column;gap:.15rem}
.who label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:.25rem;margin-top:.6rem;overflow-x:auto}
.tab{padding:.55rem .85rem;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--sun)}
main{padding-top:1rem}

input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;font-size:16px;padding:.55rem .65rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
textarea{resize:vertical;line-height:1.45}
label{display:block;font-size:.82rem;font-weight:600;margin:.7rem 0 .25rem}
select{width:auto;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:40px;padding:.4rem .95rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{min-height:34px;padding:.2rem .7rem;font-size:.86rem}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.9rem;margin:.6rem 0;min-width:0;box-shadow:0 1px 2px rgba(42,102,168,.06)}
.note{border-radius:8px;padding:.6rem .8rem;margin:.6rem 0;background:var(--surface-2)}
.note.err{background:var(--danger-soft);color:var(--danger)}
.note.ok{background:var(--sun-soft)}

.day{display:flex;align-items:baseline;gap:.5rem;margin:1.2rem 0 .4rem;font-size:1.2rem;text-transform:capitalize}
.day .dl{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:.05rem .4rem;font-family:var(--body);font-weight:600}
.sess{display:grid;grid-template-columns:5.4rem minmax(0,1fr);gap:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.8rem;margin:.45rem 0}
.time{font-family:var(--display);font-weight:600;font-size:1.3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.slotn{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);font-weight:500;margin-top:.15rem}
.what{min-width:0}
.what strong{font-size:1.02rem}
.badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:.1rem .45rem;margin-left:.35rem;vertical-align:.1em}
.b-E{background:var(--accent-soft);color:var(--accent)}
.b-V{background:var(--val-soft);color:var(--val)}
.team{display:inline-block;font-size:.8rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:.05rem .6rem;background:var(--surface-2)}
.team.mine{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.team.none{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
.clash{color:var(--danger);font-size:.8rem;font-weight:600}
.pr-row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.5rem}
.ok{color:var(--ok);font-weight:600;font-size:.88rem}
.pending{color:var(--val);font-weight:600;font-size:.88rem}
.pres{margin-top:.6rem;padding:.7rem .8rem;border-radius:8px;background:var(--surface-2)}
.pres dt{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:.5rem}
.pres dt:first-child{margin-top:0}
.pres dd{margin:.1rem 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.editor{margin-top:.7rem;padding:.9rem;border:1px solid var(--accent);border-radius:10px;background:var(--surface)}
.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .85rem;font-weight:600;font-size:.86rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:.8rem}
.pick button{min-height:56px;font-family:var(--display);font-size:1.5rem;font-weight:700;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer}
.pick button:hover{border-color:var(--accent);color:var(--accent)}
.members{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:.4rem .6rem;align-items:center}
.members span{font-weight:600;font-size:.9rem}
.list-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.small{font-size:.84rem}
.foot{margin:2.5rem 0 0;text-align:center}
.foot a{color:var(--muted);font-size:.85rem}
pre.err{white-space:pre-wrap;margin:.3rem 0 0;font:inherit}
.cal{display:grid;grid-template-columns:3.3rem repeat(5,minmax(0,1fr));gap:4px;margin-top:.6rem}
.cal-h{text-align:center;padding:.3rem 0;border-radius:8px;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cal-h b{display:block;font-family:var(--display);font-size:1.25rem;letter-spacing:0;color:var(--fg)}
.cal-h.today{background:var(--sun-soft)}
.cal-t{font-size:.7rem;line-height:1.2;color:var(--muted);font-weight:600;display:flex;flex-direction:column;justify-content:center;font-variant-numeric:tabular-nums}
.cal-break{grid-column:2/-1;text-align:center;font-size:.76rem;color:var(--c-na-ink);background:var(--c-na);border-radius:8px;padding:.25rem}
.cell{min-width:0;min-height:60px;padding:.35rem .4rem;border-radius:9px;border:2px solid transparent;text-align:left;font-size:.74rem;line-height:1.25;cursor:pointer;color:var(--c-ink);display:flex;flex-direction:column;gap:.1rem;overflow:hidden}
.cell.free{background:var(--c-free)}.cell.part{background:var(--c-part)}.cell.full{background:var(--c-full)}
.cell.na,.cell.past{background:var(--c-na);color:var(--c-na-ink);cursor:default}
.cell.mine{outline:2px solid var(--accent);outline-offset:-2px}
.cell.sel{border-color:var(--fg)}
.cell .cp{font-weight:700;font-size:.82rem}
.cell .cr{font-size:.68rem;font-weight:600;background:rgba(255,255,255,.55);color:#1b3550;border-radius:999px;padding:0 .4rem;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .cn{font-size:.64rem;opacity:.85;overflow-wrap:anywhere}
.cell .ct{margin-top:auto;font-size:.66rem}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin:.5rem 0}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-right:.3rem;vertical-align:-.1em}
.sel-panel{border:2px solid var(--fg)}
@media (max-width:560px){.cal{grid-template-columns:2.5rem repeat(5,minmax(0,1fr));gap:3px}.cell{padding:.25rem .25rem;min-height:56px}.cell .cn,.cell .ct{display:none}.cell .cr{font-size:.6rem;padding:0 .25rem}.cell .cp{font-size:.76rem}}
.wk{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin:.8rem 0 .2rem}
.wk strong{font-family:var(--display);font-size:1.15rem;text-align:center}
.slot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.3rem .7rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;margin:.4rem 0}
.slot.full{opacity:.65}
.slot .info{min-width:0}
.plazas{font-weight:600;font-size:.9rem}
.who-in{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.slot .ask{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:.6rem;margin-top:.2rem}
.slot .time{white-space:nowrap;font-size:1.15rem}
.done{border:2px solid var(--accent);background:var(--accent-soft)}
.done .big{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1.1;margin:.3rem 0 .1rem}
.avail{overflow-x:auto;margin-top:.6rem}
.avail table{border-collapse:collapse;min-width:560px;width:100%}
.avail th,.avail td{border:1px solid var(--line);padding:.35rem;text-align:center;vertical-align:top;font-size:.82rem}
.avail td input[type=checkbox]{width:1.1rem;height:1.1rem;margin:0 0 .25rem}
.avail td input[type=text]{font-size:13px;padding:.25rem .35rem;border-radius:6px}
.tag{display:inline-flex;align-items:center;gap:.3rem;border:1px solid var(--line);border-radius:999px;padding:.1rem .3rem .1rem .65rem;font-size:.84rem;margin:.15rem .25rem .15rem 0}
.tag button{border:0;background:none;cursor:pointer;font-size:1rem;line-height:1;color:var(--muted);padding:.1rem .35rem}
@media (prefers-reduced-motion:no-preference){.sess,.card{transition:border-color .15s}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p style="padding:2rem 0">Cargando MonasFIT Salud…</p></div></div>
<script>
(function(){
"use strict";
var TEAMS=12;
var SLOTS=[null,"7:55–8:50","8:50–9:45","9:45–10:40","11:10–12:05","12:05–13:00","13:00–13:55"];
var SLOT_START={"7:55":1,"8:50":2,"9:45":3,"11:10":4,"12:05":5,"13:00":6};
var GOALS=["Salud general","Reducir grasa corporal","Ganar masa muscular","Mejorar la condición física","Prevenir lesiones o dolor de espalda","Mejorar la movilidad"];
var TABS=[["mi-equipo","Mi equipo"],["reservar","Reservar"],["agenda","Agenda"],["profesorado","Profesorado"],["gestion","Gestión"]];

var DEF_SET={cap:4,open:{1:[1,2],2:[1,5,6],3:[1,2,3,4],4:[3,4,5],5:[4,5]},resp:{"1-1":"Fernando","1-2":"Fernando","2-1":"Fernando","2-5":"Fran","2-6":"Fran","3-1":"Fernando","3-2":"Fernando","3-3":"Fran","3-4":"Fran","4-3":"Fran","4-4":"Fran","4-5":"Fran","5-4":"Fernando","5-5":"Fernando"},closed:[],horizon:21};
var SLOT_MIN=[null,475,530,585,670,725,780];
var S={admin:false,adminPass:"",code:"",needCode:false,loaded:false,err:"",
  tab:"mi-equipo",team:null,config:{nextTeam:1},teams:{},teachers:{},bookings:[],prescriptions:{},settings:DEF_SET,
  rev:{config:0,teams:0,teachers:0,bookings:0,settings:0},
  name:"",btype:"E",tokens:{},lastBook:null,confirmBook:null,confirmCancel:null,weekOff:0,sd:null,scrollTop:false,scrollSel:false,
  editing:null,open:{},filter:"all",showPast:false,confirmDel:null,msg:"",msgKind:"ok",busy:false,
  bulkErr:[],noRestore:false,scrollEditor:false};

var $app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return String(n).padStart(2,"0");}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function addDays(s,n){var p=s.split("-").map(Number);var d=new Date(p[0],p[1]-1,p[2]+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function fmtDate(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});}
function fmtShort(ms){return new Date(ms).toLocaleDateString("es-ES",{day:"numeric",month:"short"});}
function dayTag(s){var t=todayStr();return s===t?"Hoy":(s===addDays(t,1)?"Mañana":"");}
function tkeyOf(n){return String(n).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80)||"sin-nombre";}
var TYPE_RANK={V:0,E:1};
function cmp(a,b){
  return a.date.localeCompare(b.date)||(a.slot-b.slot)||((TYPE_RANK[a.type]||0)-(TYPE_RANK[b.type]||0))||((a.createdAt||0)-(b.createdAt||0))||String(a.id).localeCompare(String(b.id));
}
function typeName(t){return t==="V"?"Valoración":"Entrenamiento";}

/* ---------- Lógica de rotación (pura) ---------- */
function planAssign(bookings,teachers,ptr){
  var all=bookings.map(function(b){return Object.assign({},b);});
  var val={};Object.keys(teachers).forEach(function(k){val[k]=teachers[k].valTeam||null;});
  var pend=all.filter(function(b){return !b.team;}).sort(cmp);
  var assign=[],vals=[];
  pend.forEach(function(b){
    var team=null;
    if(b.type==="V"&&val[b.tkey]){team=val[b.tkey];}
    else{
      var busy={};
      all.forEach(function(x){if(x.team&&x.date===b.date&&x.slot===b.slot)busy[x.team]=1;});
      for(var i=0;i<TEAMS;i++){
        var c=((ptr-1+i)%TEAMS)+1;
        if(!busy[c]){team=c;ptr=c%TEAMS+1;break;}
      }
      if(b.type==="V"&&team){val[b.tkey]=team;vals.push({tkey:b.tkey,team:team});}
    }
    if(team){b.team=team;assign.push({id:b.id,team:team});}
  });
  return {assign:assign,vals:vals,ptr:ptr};
}

/* ---------- Datos (API en Netlify) ---------- */
function lsGet(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}}
function lsSet(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k)||"";}catch(e){return "";}}
function ssSet(k,v){try{if(v)sessionStorage.setItem(k,v);else sessionStorage.removeItem(k);}catch(e){}}
function loadTokens(){try{return JSON.parse(lsGet("monasfit.tokens")||"{}")||{};}catch(e){return {};}}
function saveTokens(){lsSet("monasfit.tokens",Object.keys(S.tokens).length?JSON.stringify(S.tokens):"");}
async function api(path,opts){
  opts=opts||{};
  var h={"content-type":"application/json"};
  if(S.code)h["x-code"]=S.code;
  if(S.adminPass)h["x-admin"]=S.adminPass;
  var r=await fetch("/api/"+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
  var data=null;try{data=await r.json();}catch(e){}
  if(!r.ok){var er=new Error((data&&data.error)||("Error "+r.status));er.status=r.status;er.data=data;throw er;}
  return data;
}
async function refresh(){
  try{
    var d=await api("state"+(S.team&&!S.admin?"?team="+S.team:""));
    S.needCode=false;S.err="";
    S.config=d.config.data||{nextTeam:1};S.teams=d.teams.data||{};S.teachers=d.teachers.data||{};S.bookings=d.bookings.data||[];S.prescriptions=d.prescriptions||{};
    S.settings=(d.settings&&d.settings.data)||DEF_SET;
    var ids={};S.bookings.forEach(function(b){ids[b.id]=1;});var ch=false;
    Object.keys(S.tokens).forEach(function(id){if(!ids[id]){delete S.tokens[id];ch=true;}});if(ch)saveTokens();
    S.rev={config:d.config.rev,teams:d.teams.rev,teachers:d.teachers.rev,bookings:d.bookings.rev,settings:d.settings?d.settings.rev:0};
  }catch(e){
    if(e.status===401&&e.data&&e.data.needCode){S.needCode=true;S.err=S.code?"Código incorrecto.":"";}
    else S.err="No se pudieron cargar los datos. Comprueba la conexión.";
  }
  S.loaded=true;
}
function collData(n){return n==="bookings"?S.bookings:n==="teachers"?S.teachers:n==="teams"?S.teams:n==="settings"?S.settings:S.config;}
async function saveColl(n){
  var r=await api("admin",{method:"POST",body:{key:n,baseRev:S.rev[n],value:collData(n)}});
  S.rev[n]=r.rev;
}
async function saveAll(names){for(var i=0;i<names.length;i++)await saveColl(names[i]);}
function newId(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function ensureTeacher(name){
  var k=tkeyOf(name);
  if(!S.teachers[k])S.teachers[k]={tkey:k,name:name.trim(),valTeam:null};
  return k;
}
function applyPlan(){
  var plan=planAssign(S.bookings,S.teachers,Math.min(TEAMS,Math.max(1,Number(S.config.nextTeam)||1)));
  plan.vals.forEach(function(v){S.teachers[v.tkey].valTeam=v.team;});
  plan.assign.forEach(function(a){var b=S.bookings.filter(function(x){return x.id===a.id;})[0];if(b)b.team=a.team;});
  var dirty=[];
  if(plan.vals.length)dirty.push("teachers");
  if(plan.assign.length)dirty.push("bookings");
  if(plan.assign.length||plan.ptr!==S.config.nextTeam){S.config={nextTeam:plan.ptr,updatedAt:Date.now()};dirty.push("config");}
  return {n:plan.assign.length,dirty:dirty};
}
async function assignPending(){var r=applyPlan();await saveAll(r.dirty);return r.n;}
async function addBookings(items){
  var added=0,dup=0,dirty={};
  items.forEach(function(it){
    var before=Object.keys(S.teachers).length;
    var k=ensureTeacher(it.name);
    if(Object.keys(S.teachers).length>before)dirty.teachers=1;
    var exists=S.bookings.some(function(b){return b.tkey===k&&b.date===it.date&&b.slot===it.slot&&b.type===it.type;});
    if(exists){dup++;return;}
    S.bookings.push({id:newId(),date:it.date,slot:it.slot,type:it.type,teacher:S.teachers[k].name,tkey:k,team:null,createdAt:Date.now()+added});
    added++;dirty.bookings=1;
  });
  var r=applyPlan();
  r.dirty.forEach(function(n){dirty[n]=1;});
  await saveAll(["teachers","bookings","config"].filter(function(n){return dirty[n];}));
  return {added:added,dup:dup,assigned:r.n};
}

/* ---------- Lectura de fechas y franjas ---------- */
function parseDate(t){
  var m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t);var y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3];}
  else{m=/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/.exec(t);if(!m)return null;d=+m[1];mo=+m[2];y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;}
  var dt=new Date(y,mo-1,d);if(dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  return y+"-"+pad(mo)+"-"+pad(d);
}
function parseSlot(t){
  var s=String(t).trim().replace(/[ªº°\.]$/,"").replace(".",":");
  if(/^[1-6]$/.test(s))return +s;
  var m=/^(\d{1,2}):(\d{2})/.exec(s);if(m){var key=(+m[1])+":"+m[2];if(SLOT_START[key])return SLOT_START[key];}
  return null;
}
function parseBulk(text){
  var out=[],errs=[];
  text.split(/\r?\n/).map(function(l){return l.trim();}).forEach(function(line,i){
    if(!line)return;
    var p=line.split(/[;,\t]/).map(function(x){return x.trim();});
    if(p.length<4){errs.push("Línea "+(i+1)+": faltan datos (fecha, franja, profesor, tipo).");return;}
    var date=parseDate(p[0]),slot=parseSlot(p[1]),type=p[p.length-1].toUpperCase(),name=p.slice(2,p.length-1).join(", ");
    if(!date){errs.push("Línea "+(i+1)+": fecha no válida («"+p[0]+"»).");return;}
    if(!slot){errs.push("Línea "+(i+1)+": franja no válida («"+p[1]+"»). Usa 1 a 6 o la hora de inicio.");return;}
    if(type!=="E"&&type!=="V"){errs.push("Línea "+(i+1)+": el tipo debe ser E o V.");return;}
    if(!name){errs.push("Línea "+(i+1)+": falta el nombre del profesor.");return;}
    out.push({date:date,slot:slot,type:type,name:name});
  });
  return {items:out,errs:errs};
}

/* ---------- Permisos de vista ---------- */
function vTeamOf(k){var t=S.teachers[k];if(t&&t.valTeam)return t.valTeam;var b=S.bookings.filter(function(x){return x.tkey===k&&x.type==="V"&&x.team;})[0];return b?b.team:null;}
function canEditPres(k){
  if(S.admin)return true;if(!S.team)return false;
  return vTeamOf(k)===S.team;
}
function canSee(k){
  if(S.admin)return true;if(!S.team)return false;
  if(vTeamOf(k)===S.team)return true;
  return S.bookings.some(function(b){return b.tkey===k&&b.type==="E"&&b.team===S.team;});
}

function sessionCard(b){
  var t=S.teachers[b.tkey]||{},p=S.prescriptions[b.tkey],tag=dayTag(b.date),extra="";

    extra='<div class="pr-row">'+(p?'<span class="ok">Prescripción guardada</span>':'<span class="pending">Prescripción pendiente</span>')+
      (canEditPres(b.tkey)?' <button class="btn sm" data-act="edit" data-k="'+esc(b.tkey)+'">'+(p?"Editar":"Escribir prescripción")+'</button>':'')+'</div>';

function groupByDate(list){
  var g=[],cur=null;
  list.forEach(function(b){if(!cur||cur.date!==b.date){cur={date:b.date,items:[]};g.push(cur);}cur.items.push(b);});
  return g;
}
function dayHead(d){var t=dayTag(d);return '<h3 class="day">'+(t?'<span class="dl">'+t+'</span>':'')+'<span>'+esc(fmtDate(d))+'</span></h3>';}

/* ---------- Reservar (profesorado) ---------- */
function mondayOf(s){var p=s.split("-").map(Number);var w=new Date(p[0],p[1]-1,p[2]).getDay();return addDays(s,w===0?-6:1-w);}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes();}
function fmtDay(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("es-ES",{day:"numeric",month:"long"});}
function bookDone(r){
  var b=r.booking;
  return '<div class="card done" role="status"><p class="eyebrow">Reserva confirmada</p><strong>'+esc(b.teacher)+'</strong><span class="badge b-'+b.type+'">'+typeName(b.type)+'</span>'+
    '<p>'+esc(fmtDate(b.date))+' · '+SLOTS[b.slot]+'</p>'+
    '<div class="big">'+(b.type==="V"?"Te valora el equipo ":"Te entrena el equipo ")+b.team+'</div>'+
    (r.members?'<p>'+esc(r.members)+'</p>':'')+
    (b.type==="V"?'<p class="small">A partir de ahora será siempre este equipo quien te valore.</p>':'')+
    '<div class="row" style="margin-top:.6rem"><button class="btn sm" data-act="closeDone">Entendido</button></div></div>';
}
function wkTitle(base){
  var p=base.split("-").map(Number),a=new Date(p[0],p[1]-1,p[2]),f=addDays(base,4).split("-").map(Number),e=new Date(f[0],f[1]-1,f[2]);
  var m=function(d){return d.toLocaleDateString("es-ES",{month:"long"});};
  return "Semana del "+a.getDate()+(a.getMonth()!==e.getMonth()?" de "+m(a):"")+" al "+e.getDate()+" de "+m(e);
}
var DAYABB=["Lun","Mar","Mié","Jue","Vie"];
function cellInfo(d,s,wd,st,today,last,tk){
  var open=(st.open[wd]||[]).indexOf(s)>=0;
  var list=S.bookings.filter(function(b){return b.date===d&&b.slot===s;});
  var r={d:d,s:s,wd:wd,list:list,n:list.length,resp:st.resp[wd+"-"+s]||"",state:"na"};
  if(!open||d<today||d>last||st.closed.indexOf(d)>=0||st.closed.indexOf(d+"#"+s)>=0){r.state="na";return r;}
  if(d===today&&nowMin()>=SLOT_MIN[s]){r.state="past";return r;}
  if(tk&&list.some(function(b){return b.tkey===tk;})){r.mine=true;}
  r.state=r.n>=st.cap?"full":(r.n>0?"part":"free");
  return r;
}
function calCell(c,st){
  var cls="cell "+c.state+(c.mine?" mine":"")+((S.confirmBook&&S.confirmBook.date===c.d&&S.confirmBook.slot===c.s)?" sel":"");
  if(c.state==="na")return '<div class="'+cls+'" aria-label="No disponible"><span class="ct">'+'<span aria-hidden="true">⊘</span></span></div>';
  if(c.state==="past")return '<div class="'+cls+'"><span class="ct">Ya empezó</span></div>';
  var who=c.list.map(function(b){return esc(b.teacher)+' ('+b.type+')';}).join(", ");

function vReservar(){

    '<p class="muted small">'+(S.btype==="V"?"La valoración de tu composición corporal la hace siempre el mismo equipo. Si ya te valoraron, volverá a ser ese equipo.":"El entrenamiento guiado va rotando entre los equipos. Al reservar verás cuál te toca.")+'</p></div>';

  var mine=S.bookings.filter(function(b){return b.date>=today&&((tk&&b.tkey===tk)||S.tokens[b.id]);}).sort(cmp);
  if(mine.length){
    html+='<div class="card"><h3>Mis reservas</h3>';

        '<div class="row">'+(can?(S.confirmCancel===b.id?'<button class="btn sm danger" data-act="doCancel" data-id="'+esc(b.id)+'"'+(S.busy?" disabled":"")+'>Sí, cancelar</button><button class="btn sm" data-act="noCancel">No</button>':'<button class="btn sm" data-act="askCancel" data-id="'+esc(b.id)+'">Cancelar</button>'):'')+'</div></div>';

  html+='<div class="legend"><span><i style="background:var(--c-free)"></i>Disponible</span><span><i style="background:var(--c-part)"></i>Quedan plazas</span><span><i style="background:var(--c-full)"></i>Completo</span><span><i style="background:var(--c-na)"></i>No disponible</span></div>';

function render(){
  var saved={},act=document.activeElement,fid=act&&act.id,ss=null,se=null,restore=!S.noRestore;
  S.noRestore=false;
  $app.querySelectorAll("[data-keep]").forEach(function(el){if(el.id)saved[el.id]=el.value;});
  if(act&&typeof act.selectionStart==="number"){try{ss=act.selectionStart;se=act.selectionEnd;}catch(e){}}
  $app.innerHTML=view();
  if(restore){
    Object.keys(saved).forEach(function(id){var el=document.getElementById(id);if(el&&el.hasAttribute("data-keep"))el.value=saved[id];});
    if(fid){var f=document.getElementById(fid);if(f){try{f.focus({preventScroll:true});if(ss!=null&&f.setSelectionRange)f.setSelectionRange(ss,se);}catch(e){}}}
  }
  if(S.scrollTop){S.scrollTop=false;window.scrollTo(0,0);}
  if(S.scrollSel){S.scrollSel=false;var sp=document.getElementById("selPanel");if(sp)sp.scrollIntoView({block:"nearest",behavior:"smooth"});}
  if(S.scrollEditor){S.scrollEditor=false;var ed=document.getElementById("presTop");if(ed)ed.scrollIntoView({block:"center"});}
}

/* ---------- Acciones ---------- */
var msgTimer=null;
function say(text,kind){
  S.msg=text;S.msgKind=kind||"ok";clearTimeout(msgTimer);
  if(text)msgTimer=setTimeout(function(){S.msg="";render();},6000);
}
function logoutAdmin(){S.admin=false;S.adminPass="";ssSet("monasfit.admin","");if(S.tab==="gestion")S.tab="mi-equipo";}
async function run(fn,okMsg){
  if(S.busy)return;
  S.busy=true;render();
  var failed=false;
  try{var r=await fn();say(typeof okMsg==="function"?okMsg(r):(okMsg||""),"ok");}
  catch(e){
    failed=true;
    if(e.status===409)say("Otra persona cambió los datos a la vez. Se han recargado: repite la acción.","err");
    else if(e.status===403&&S.admin){logoutAdmin();say("La sesión de coordinación ha caducado. Entra de nuevo.","err");}
    else if(e.status===401||e.status===403||e.status===422||e.status===503)say(e.message,"err");
    else say("No se pudo guardar. "+(e.message||"Inténtalo de nuevo."),"err");
  }
  if(failed)await refresh();
  S.busy=false;render();
}
function val(id){var el=document.getElementById(id);return el?el.value:"";}
function setTeam(n){S.team=n||null;lsSet("monasfit.team",n?String(n):"");}
function summary(r){
  var s=r.added+" reserva"+(r.added===1?"":"s")+" añadida"+(r.added===1?"":"s")+" y "+r.assigned+" asignada"+(r.assigned===1?"":"s")+".";
  if(r.dup)s+=" "+r.dup+" repetida"+(r.dup===1?"":"s")+" omitida"+(r.dup===1?"":"s")+".";
  return s;
}
var actions={
  pickTeam:function(d){setTeam(Number(d.n));render();refresh().then(render);},
  filter:function(d){S.filter=d.f;render();},
  togglePast:function(){S.showPast=!S.showPast;render();},
  toggle:function(d){S.open[d.id]=!S.open[d.id];render();},
  edit:function(d){S.editing=d.k;S.scrollEditor=true;if(S.tab!=="profesorado"&&S.tab!=="mi-equipo")S.tab="mi-equipo";render();},
  cancelEdit:function(){S.editing=null;render();},
  savePres:function(d){
    var k=d.k,t=S.teachers[k]||{name:k},plan=val("pe-plan").trim();

    var rec={tkey:k,teacher:t.name,team:S.team||vTeamOf(k)||null,goal:val("pe-goal").trim(),days:Number(val("pe-days"))||3,plan:plan,notes:val("pe-notes").trim()};
    run(async function(){var r=await api("prescription",{method:"POST",body:rec});S.prescriptions[k]=r;S.editing=null;S.noRestore=true;},"Prescripción guardada.");
  },
  login:function(){
    var p=val("adm-pass");if(!p)return;
    run(async function(){
      S.adminPass=p;
      try{await api("admin-check");}catch(e){S.adminPass="";throw e;}
      S.admin=true;ssSet("monasfit.admin",p);
      await refresh();S.tab="gestion";S.noRestore=true;
    },"Sesión de coordinación iniciada.");
  },
  logout:function(){logoutAdmin();render();refresh().then(render);},
  enterCode:function(){

    refresh().then(function(){S.noRestore=!S.needCode;render();});
  },
  assign:function(){run(assignPending,function(n){return n+" sesión"+(n===1?"":"es")+" asignada"+(n===1?"":"s")+".";});},
  addOne:function(){
    var date=parseDate(val("f-date")),name=val("f-teacher").trim();
    if(!date){say("Elige una fecha.","err");render();return;}
    if(!name){say("Escribe el nombre del profesor.","err");render();return;}
    var it={date:date,slot:Number(val("f-slot")),type:val("f-type"),name:name};
    run(async function(){var r=await addBookings([it]);S.noRestore=true;return r;},summary);

  addBulk:function(){

    run(async function(){var res=await addBookings(r.items);if(!r.errs.length)S.noRestore=true;return res;},summary);
  },
  saveTeams:function(){
    run(async function(){
      var n,c=0;
      for(n=1;n<=TEAMS;n++){
        var m=val("tm-"+n).trim();
        if(m!==membersOf(n)||!S.teams[n]){S.teams[n]={n:n,members:m};c++;}
      }
      if(c)await saveColl("teams");
      return c;
    },function(c){return c?"Equipos guardados.":"No había cambios.";});
  },
  btype:function(d){S.btype=d.t;S.confirmBook=null;render();},
  wkPrev:function(){S.weekOff=Math.max(0,S.weekOff-1);S.confirmBook=null;render();},
  wkNext:function(){S.weekOff++;S.confirmBook=null;render();},
  pick:function(d){S.confirmBook={date:d.d,slot:Number(d.s)};S.scrollSel=true;render();},

  closeDone:function(){S.lastBook=null;render();},
  doBook:function(){
    var c=S.confirmBook;if(!c)return;
    var nm=val("bk-name").trim().replace(/\s+/g," ");
    if(nm.length<2){say("Escribe tu nombre antes de reservar.","err");S.scrollTop=true;render();return;}
    if(nm!==S.name){S.name=nm;lsSet("monasfit.name",nm);}
    run(async function(){
      try{
        var r=await api("book",{method:"POST",body:{name:S.name,type:S.btype,date:c.date,slot:c.slot}});
        S.tokens[r.booking.id]=r.token;saveTokens();S.lastBook=r;S.confirmBook=null;S.scrollTop=true;
        await refresh();
      }catch(e){S.confirmBook=null;throw e;}
    },"");
  },
  askCancel:function(d){S.confirmCancel=d.id;render();},
  noCancel:function(){S.confirmCancel=null;render();},
  doCancel:function(d){
    var tok=S.tokens[d.id];
    run(async function(){
      try{
        await api("cancel",{method:"POST",body:{id:d.id,token:tok}});
        delete S.tokens[d.id];saveTokens();if(S.lastBook&&S.lastBook.booking.id===d.id)S.lastBook=null;
        S.confirmCancel=null;await refresh();
      }catch(e){S.confirmCancel=null;throw e;}
    },"Reserva cancelada.");
  },
  addClosed:function(){
    var dt=parseDate(val("cl-date"));
    if(!dt){say("Elige el día que quieres cerrar.","err");render();return;}
    var sl=Number(val("cl-slot"))||0,key=sl?dt+"#"+sl:dt,sd=sdGet();
    if(sd.closed.indexOf(key)<0){sd.closed.push(key);sd.closed.sort();}
    var n=S.bookings.filter(function(b){return b.date===dt&&(!sl||b.slot===sl);}).length;
    if(n)say("Ojo: ya hay "+n+" reserva"+(n===1?"":"s")+" en "+(sl?"esa franja":"ese día")+". Seguirán ahí hasta que las borres en «Reservas».","err");
    render();
  },
  rmClosed:function(d){var sd=sdGet();sd.closed=sd.closed.filter(function(x){return x!==d.d;});render();},
  saveSet:function(){
    var sd=sdGet(),resp={},d,sl;
    for(d=1;d<=5;d++)for(sl=1;sl<=6;sl++){var t=val("rs-"+d+"-"+sl).trim();if(t)resp[d+"-"+sl]=t;}
    var v={cap:sd.cap,open:sd.open,resp:resp,closed:sd.closed,horizon:sd.horizon};
    run(async function(){S.settings=v;await saveColl("settings");S.sd=null;},"Disponibilidad guardada.");
  },
  del:function(d){S.confirmDel=d.id;render();},
  delNo:function(){S.confirmDel=null;render();},
  delYes:function(d){
    run(async function(){S.bookings=S.bookings.filter(function(b){return b.id!==d.id;});S.confirmDel=null;await saveColl("bookings");},"Reserva borrada.");
  }
};

  next:function(el){var n=Number(el.value)||1;run(async function(){S.config={nextTeam:n,updatedAt:Date.now()};await saveColl("config");},"Próximo equipo actualizado.");},
  bteam:function(el){var id=el.dataset.id,t=el.value?Number(el.value):null;run(async function(){var b=S.bookings.filter(function(x){return x.id===id;})[0];if(b)b.team=t;await saveColl("bookings");},"Equipo actualizado.");},
  valTeam:function(el){var k=el.dataset.k,t=el.value?Number(el.value):null;run(async function(){if(S.teachers[k])S.teachers[k].valTeam=t;await saveColl("teachers");},"Equipo de valoración actualizado.");}
};
$app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var f=actions[b.dataset.act];if(f)f(b.dataset);
});
$app.addEventListener("change",function(e){
  var el=e.target;if(!el.dataset||!el.dataset.change)return;
  var f=changes[el.dataset.change];if(f)f(el);
});
$app.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  if(e.target.id==="code-in")actions.enterCode();
  else if(e.target.id==="adm-pass")actions.login();
});
function readHash(){
  var h=(location.hash||"").slice(1);
  if(TABS.some(function(t){return t[0]===h;})){S.tab=h;}
}
window.addEventListener("hashchange",function(){readHash();render();window.scrollTo(0,0);});

async function init(){
  S.code=lsGet("monasfit.code");S.name=lsGet("monasfit.name");S.tokens=loadTokens();
  var t=lsGet("monasfit.team");if(t)S.team=Number(t)||null;
  S.adminPass=ssGet("monasfit.admin");
  readHash();render();
  if(S.adminPass){try{await api("admin-check");S.admin=true;}catch(e){S.adminPass="";S.admin=false;ssSet("monasfit.admin","");}}
  await refresh();
  if(S.admin&&!location.hash)S.tab=S.team?"mi-equipo":"gestion";
  render();
  function tick(){if(document.hidden||S.busy||S.needCode||!S.loaded)return;refresh().then(render);}
  setInterval(tick,30000);
  document.addEventListener("visibilitychange",tick);
}
init();
})();
</script>
</body>
</html>
