<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a66a8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MonasFIT Reservas">
<title>MonasFIT Salud</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app móvil de una columna. Cabecera fija con equipo y pestañas; sesiones como filas con la hora a la izquierda. */
:root{
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#f3f8fe; --surface:#ffffff; --surface-2:#e9f1fa; --line:#d3e0ee;
  --fg:#1b2b3c; --muted:#5a6b7d;
  --accent:#2459a8; --accent-soft:#dcebfa; --logo-blue:#2f6fd0; --warm:#f6a65a; --warm-soft:#fde8cf; --warm-ink:#8a4a0c; --accent-ink:#ffffff;
  --sun:#f6a65a; --sun-soft:#fff3c7;
  --val:#a35410; --val-soft:#fde8d2;
  --danger:#b3261e; --danger-soft:#fbe0dd; --ok:#27764a;
  --c-free:#d6eafb; --c-part:#fff1bd; --c-full:#fcd9b4; --c-na:#eef0f4; --c-ink:#1b3550; --c-na-ink:#7b8494;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1722; --surface:#17212f; --surface-2:#1f2c3d; --line:#2b3b50;
  --fg:#e8eef6; --muted:#9fb0c4;
  --accent:#7fb8f0; --accent-soft:#1c3350; --logo-blue:#7fb8f0; --warm:#f5b36b; --warm-soft:#3a2a14; --warm-ink:#f5c690; --accent-ink:#0b1b2c;
  --sun:#f5b36b; --sun-soft:#3a3315;
  --val:#f5b36b; --val-soft:#3a2a14;
  --danger:#ff9087; --danger-soft:#3b1b18; --ok:#7fd488;
  --c-free:#1d3a57; --c-part:#4a4217; --c-full:#55361a; --c-na:#1c2430; --c-ink:#e8eef6; --c-na-ink:#8794a6;
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);
  padding-block:0 4rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:1.9rem;letter-spacing:.01em}
h2{font-size:1.5rem;margin:1.4rem 0 .6rem}
h3{font-size:1.15rem}
h4{font-size:1.1rem;margin-bottom:.5rem}
p{margin:.3rem 0}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 .15rem;font-weight:600}

.top::before{content:"";display:block;height:5px;margin:-.7rem -16px .6rem;background:linear-gradient(90deg,#5aa9e6,#f6a65a 55%,#ffd666)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:-16px;padding:.7rem 16px 0}
.brand{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.stars{display:flex;gap:.15rem;margin:.2rem 0 .5rem}.star{border:0;background:none;font-size:1.9rem;line-height:1;padding:.1rem .2rem;color:#c9d3df;cursor:pointer;min-width:40px;min-height:44px}.star.on{color:#f6a65a}.rate-t{font-weight:700;margin:1rem 0 0}.rate-t:first-of-type{margin-top:.3rem}.rrow{border-top:1px solid var(--line);padding:.5rem 0}.rrow:first-child{border-top:0}
.docsel{margin-top:.35rem;font-size:.8rem;padding:.25rem .4rem;min-height:0;width:auto;max-width:100%}
.brandL{display:flex;align-items:center;gap:.7rem;min-width:0}
.logo{height:72px;width:72px;flex:none;object-fit:contain;border-radius:12px;background:#fff}
.who{display:flex;flex-direction:column;gap:.15rem}
.who-chip{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:0;padding:.3rem .65rem;border:1px solid var(--line,#ccc);border-radius:999px;background:transparent;color:inherit;font:inherit;cursor:pointer;min-height:40px;justify-content:center}
.who-chip span{font-weight:700;font-size:.9rem;line-height:1.1}
.who-chip small{font-size:.66rem;color:var(--muted);text-decoration:underline}
.who label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:.35rem;margin-top:.6rem;padding-bottom:.6rem}
.tab{--c:90,169,230;flex:1 1 0;min-width:0;text-align:center;padding:.45rem .3rem;text-decoration:none;color:var(--fg);font-weight:600;font-size:.92rem;border-radius:10px;background:rgba(var(--c),.16);border:1.5px solid rgba(var(--c),.30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[href="#reservar"]{--c:90,169,230}
.tab[href="#agenda"]{--c:246,166,90}
.tab[href="#profesorado"]{--c:255,214,102}
.tab[href="#mi-equipo"]{--c:240,114,106}
.tab[href="#gestion"]{--c:47,111,208}
.tab[aria-current="page"]{background:rgba(var(--c),.42);border-color:rgb(var(--c));box-shadow:0 1px 0 rgba(var(--c),.6)}
@media(max-width:420px){.tab{font-size:.82rem;padding:.45rem .15rem}}
main{padding-top:1rem}

input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;font-size:16px;padding:.55rem .65rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
textarea{resize:vertical;line-height:1.45}
label{display:block;font-size:.82rem;font-weight:600;margin:.7rem 0 .25rem}
select{width:auto;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:40px;padding:.4rem .95rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{min-height:34px;padding:.2rem .7rem;font-size:.86rem}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.9rem;margin:.6rem 0;min-width:0;box-shadow:0 1px 2px rgba(42,102,168,.06)}
.note{border-radius:8px;padding:.6rem .8rem;margin:.6rem 0;background:var(--surface-2)}
.note.err{background:var(--danger-soft);color:var(--danger)}
.note.ok{background:var(--sun-soft)}

.day{display:flex;align-items:baseline;gap:.5rem;margin:1.2rem 0 .4rem;font-size:1.2rem}
.day>span:last-child{display:inline-block}.day>span:last-child::first-letter{text-transform:uppercase}
.day .dl{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:.05rem .4rem;font-family:var(--body);font-weight:600}
.sess{display:grid;grid-template-columns:5.4rem minmax(0,1fr);gap:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.8rem;margin:.45rem 0}
.time{font-family:var(--display);font-weight:600;font-size:1.3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.slotn{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);font-weight:500;margin-top:.15rem}
.what{min-width:0}
.what strong{font-size:1.02rem}
.badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:.1rem .45rem;margin-left:.35rem;vertical-align:.1em}
.b-E{background:var(--warm-soft);color:var(--warm-ink)}
.b-V{background:var(--accent-soft);color:var(--accent)}
.team{display:inline-block;font-size:.8rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:.05rem .6rem;background:var(--surface-2)}
.team.mine{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.team.none{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
.clash{color:var(--danger);font-size:.8rem;font-weight:600}
.pr-row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.5rem}
.ok{color:var(--ok);font-weight:600;font-size:.88rem}
.pending{color:var(--val);font-weight:600;font-size:.88rem}
.pres{margin-top:.6rem;padding:.7rem .8rem;border-radius:8px;background:var(--surface-2)}
.pres dt{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:.5rem}
.pres dt:first-child{margin-top:0}
.pres dd{margin:.1rem 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.editor{margin-top:.7rem;padding:.9rem;border:1px solid var(--accent);border-radius:10px;background:var(--surface)}
.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .85rem;font-weight:600;font-size:.86rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:.8rem}
.pick button{min-height:56px;font-family:var(--display);font-size:1.5rem;font-weight:700;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer}
.pick button:hover{border-color:var(--accent);color:var(--accent)}
.members{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:.4rem .6rem;align-items:center}
.members span{font-weight:600;font-size:.9rem}
.list-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.small{font-size:.84rem}
.foot{margin:2.5rem 0 0;text-align:center}
.foot a{color:var(--muted);font-size:.85rem}
pre.err{white-space:pre-wrap;margin:.3rem 0 0;font:inherit}
.cal{display:grid;grid-template-columns:3.3rem repeat(5,minmax(0,1fr));gap:4px;margin-top:.6rem}
.cal-h{text-align:center;padding:.3rem 0;border-radius:8px;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cal-h b{display:block;font-family:var(--display);font-size:1.25rem;letter-spacing:0;color:var(--fg)}
.cal-h.today{background:var(--sun-soft)}
.cal-t{font-size:.7rem;line-height:1.2;color:var(--muted);font-weight:600;display:flex;flex-direction:column;justify-content:center;font-variant-numeric:tabular-nums}
.cal-break{grid-column:2/-1;text-align:center;font-size:.76rem;color:var(--c-na-ink);background:var(--c-na);border-radius:8px;padding:.25rem}
.cell{min-width:0;min-height:60px;padding:.35rem .4rem;border-radius:9px;border:2px solid transparent;text-align:left;font-size:.74rem;line-height:1.25;cursor:pointer;color:var(--c-ink);display:flex;flex-direction:column;gap:.1rem;overflow:hidden}
.cell.free{background:var(--c-free)}.cell.part{background:var(--c-part)}.cell.full{background:var(--c-full)}
.cell.na,.cell.past{background:var(--c-na);color:var(--c-na-ink);cursor:default}
.cell.mine{outline:2px solid var(--accent);outline-offset:-2px}
.cell.sel{border-color:var(--fg)}
.cell .cp{font-weight:700;font-size:.82rem}
.cell .cr{font-size:.68rem;font-weight:600;background:rgba(255,255,255,.55);color:#1b3550;border-radius:999px;padding:0 .4rem;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .cn{font-size:.64rem;opacity:.85;overflow-wrap:anywhere}
.cell .ct{margin-top:auto;font-size:.66rem}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin:.5rem 0}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-right:.3rem;vertical-align:-.1em}
.sel-panel{border:2px solid var(--fg)}
@media (max-width:560px){.cal{grid-template-columns:2.5rem repeat(5,minmax(0,1fr));gap:3px}.cell{padding:.25rem .25rem;min-height:56px}.cell .cn,.cell .ct{display:none}.cell .cr{font-size:.6rem;padding:0 .25rem}.cell .cp{font-size:.76rem}}
.wk{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin:.8rem 0 .2rem}
.wk strong{font-family:var(--display);font-size:1.15rem;text-align:center}
.slot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.3rem .7rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;margin:.4rem 0}
.slot.full{opacity:.65}
.slot .info{min-width:0}
.plazas{font-weight:600;font-size:.9rem}
.who-in{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.slot .ask{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:.6rem;margin-top:.2rem}
.slot .time{white-space:nowrap;font-size:1.15rem}
.done{border:2px solid var(--accent);background:var(--accent-soft)}
.done .big{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1.1;margin:.3rem 0 .1rem}
.avail{overflow-x:auto;margin-top:.6rem}
.avail table{border-collapse:collapse;min-width:560px;width:100%}
.avail th,.avail td{border:1px solid var(--line);padding:.35rem;text-align:center;vertical-align:top;font-size:.82rem}
.avail td input[type=checkbox]{width:1.1rem;height:1.1rem;margin:0 0 .25rem}
.avail td input[type=text]{font-size:13px;padding:.25rem .35rem;border-radius:6px}
.tag{display:inline-flex;align-items:center;gap:.3rem;border:1px solid var(--line);border-radius:999px;padding:.1rem .3rem .1rem .65rem;font-size:.84rem;margin:.15rem .25rem .15rem 0}
.tag button{border:0;background:none;cursor:pointer;font-size:1rem;line-height:1;color:var(--muted);padding:.1rem .35rem}
@media (prefers-reduced-motion:no-preference){.sess,.card{transition:border-color .15s}}
.meas{display:grid;grid-template-columns:minmax(0,1fr);gap:.15rem;padding:.55rem 0;border-top:1px solid var(--line)}
.meas:first-of-type{border-top:0}
.meas .vals{display:flex;flex-wrap:wrap;gap:.2rem .9rem;font-size:.88rem}
.meas .vals b{font-weight:600}
.fkey{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.6rem;letter-spacing:.25em;font-weight:600;padding:.4rem .7rem;background:var(--surface);border:1px dashed var(--accent);border-radius:10px;display:inline-block;margin:.3rem 0}
.keep2{grid-template-columns:1fr 1fr!important}
.lock{display:inline-block;margin-right:.25rem}
.tag{display:inline-block;font-size:.72rem;padding:.05rem .45rem;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-left:.4rem}
.tag.on{background:var(--accent-soft);color:var(--accent)}
.rank{display:flex;align-items:center;gap:.6rem;padding:.5rem .6rem;border-radius:10px;margin-top:.35rem;background:var(--surface-2)}
.rank.gold{background:rgba(255,214,102,.28)}.rank.mine{outline:2px solid rgba(90,169,230,.8)}
.rank .pos{min-width:2rem;text-align:center;font-weight:700;font-size:1.15rem}.rank .rn{flex:1;min-width:0}.rank .rs{white-space:nowrap}
.fab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:.55rem;border:0;cursor:pointer;color:#3b2a00;font:700 1rem var(--body);padding:.55rem 1rem .55rem .65rem;border-radius:999px;background:linear-gradient(135deg,#ffd666,#f6a65a 60%,#f0726a);box-shadow:0 6px 18px rgba(240,114,106,.45),0 0 0 0 rgba(255,214,102,.7);animation:fabfly 3.2s ease-in-out infinite,fabpulse 2.4s ease-out infinite}
.fab-i{font-size:1.7rem;line-height:1;display:inline-block;animation:fabwig 3.2s ease-in-out infinite}
.fab-t{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}.fab-t small{font-weight:600;font-size:.72rem;opacity:.85}
.fab:active{transform:scale(.96)}
@keyframes fabfly{0%,100%{transform:translateY(0) rotate(-1deg)}25%{transform:translateY(-9px) rotate(1.5deg)}50%{transform:translateY(-3px) rotate(-1deg)}75%{transform:translateY(-11px) rotate(1deg)}}
@keyframes fabpulse{0%{box-shadow:0 6px 18px rgba(240,114,106,.45),0 0 0 0 rgba(255,214,102,.75)}70%,100%{box-shadow:0 6px 18px rgba(240,114,106,.45),0 0 0 16px rgba(255,214,102,0)}}
@keyframes fabwig{0%,100%{transform:rotate(0)}40%{transform:rotate(-12deg) scale(1.1)}60%{transform:rotate(12deg) scale(1.1)}}
@media(prefers-reduced-motion:reduce){.fab,.fab-i{animation:none}}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(15,23,34,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:85vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:.8rem 16px max(1rem,env(safe-area-inset-bottom,0px))}
.sheet .card{margin:.5rem 0 0}.sheet-x{display:block;margin-left:auto}

/* ---- v1.12 confirmaciones ---- */
.confbox{border:2px solid var(--warm);background:linear-gradient(135deg,rgba(255,214,102,.28),rgba(246,166,90,.14));border-radius:16px;padding:.8rem .9rem;margin:.4rem 0 1rem}
.confbox h3{margin:0 0 .2rem}
.conf{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--warm);border-radius:12px;padding:.7rem;margin:.6rem 0}
.conf.t-V{border-left-color:var(--logo-blue)}
.conf-h{display:flex;gap:.8rem;align-items:center}.conf-h .time{font-size:1.3rem}
.conf .row{margin-top:.6rem}.conf .row .btn{flex:1;white-space:nowrap;padding-inline:.4rem}.due{margin:.5rem 0 0}
.pendchip{display:inline-block;font-size:.75rem;font-weight:700;background:rgba(246,166,90,.25);color:var(--warm-ink);border-radius:999px;padding:.05rem .5rem;margin-left:.35rem}
.okchip{font-size:.78rem;font-weight:700;color:var(--ok,#1a7f4b)}
.tab .ti{position:relative}.tbadge{position:absolute;top:-.35rem;right:-.7rem;background:#e5484d;color:#fff;font-style:normal;font-size:.68rem;font-weight:700;border-radius:999px;min-width:1.15rem;height:1.15rem;line-height:1.15rem;text-align:center;padding:0 .25rem}
.load{display:grid;grid-template-columns:3.2rem 1fr 2rem;gap:.5rem;align-items:center;margin:.25rem 0;font-size:.88rem}
.load .bar{display:flex;height:.8rem;background:var(--line);border-radius:6px;overflow:hidden}.load .bar i{display:block;height:100%}.load .bar .g{background:#2e9e6a}.load .bar .o{background:#f6a65a}
.load b{text-align:right}
/* ---- v1.12.2 cabecera y botón Ranking en móvil ---- */
@media (max-width:560px){
.brand{flex-wrap:nowrap;gap:.5rem;align-items:center}
.brandL{flex:1 1 auto;gap:.5rem}
.brandL .logo{width:46px;height:46px}
.brand h1{font-size:1.45rem;line-height:1.05}
.brand .eyebrow{font-size:.62rem;letter-spacing:.06em}
.who{flex:none;align-items:flex-end}
.who label{font-size:.6rem;letter-spacing:.05em}
.who select{width:4.3rem;min-height:40px;padding:.2rem .4rem;font-size:1.05rem}
.fab{padding:.5rem;width:56px;height:56px;justify-content:center;bottom:max(12px,env(safe-area-inset-bottom,0px))}
.fab-t{display:none}
.fab-i{font-size:1.9rem}
}
/* ---- v1.13 criterios de valoración ---- */
.rit{padding:.35rem 0;border-top:1px dashed var(--line)}.rit-l{font-weight:600;font-size:.92rem}.rit .stars{margin:.1rem 0 0}.rit .star{font-size:1.6rem}
.rank{flex-wrap:wrap}.rank .rsub{flex-basis:100%;margin-left:2.6rem;font-size:.78rem;color:var(--muted)}
/* ---- v1.12 calendario más legible ---- */
@media (max-width:560px){
.cal.rv{grid-template-columns:3.1rem repeat(5,minmax(0,1fr))}
.cal.rv .cal-t{font-size:.8rem;line-height:1.25}.cal.rv .cal-t b{font-size:.88rem;color:var(--fg)}
.cal.rv .cal-h{font-size:.8rem;font-weight:700;padding:.15rem 0}.cal.rv .cal-h b{font-size:1.4rem}
.cal.rv .cell .cp{font-size:1rem}.cal.rv .cell .cr{font-size:.7rem}
.cal.rv .cell .ct{font-size:.8rem}

<body>
<div id="app"><div class="wrap"><p style="padding:2rem 0">Cargando MonasFIT Salud…</p></div></div>
<script>
(function(){
"use strict";
var TEAMS=12;
var SLOTS=[null,"7:55–8:50","8:50–9:45","9:45–10:40","11:10–12:05","12:05–13:00","13:00–13:55"];
var SLOT_START={"7:55":1,"8:50":2,"9:45":3,"11:10":4,"12:05":5,"13:00":6};
var GOALS=["Salud general","Reducir grasa corporal","Ganar masa muscular","Mejorar la condición física","Prevenir lesiones o dolor de espalda","Mejorar la movilidad"];
var TABS=[["reservar","Reservar","📅"],["agenda","Agenda","📋"],["profesorado","Profesorado","🧑‍🏫"],["mi-equipo","Equipo","👥"],["gestion","Gestión","⚙️"]];

var DEF_SET={cap:4,open:{1:[1,2],2:[1,5,6],3:[1,2,3,4],4:[3,4,5],5:[4,5]},resp:{"1-1":"Fernando","1-2":"Fernando","2-1":"Fernando","2-5":"Fran","2-6":"Fran","3-1":"Fernando","3-2":"Fernando","3-3":"Fran","3-4":"Fran","4-3":"Fran","4-4":"Fran","4-5":"Fran","5-4":"Fernando","5-5":"Fernando"},closed:[],horizon:21};
var SLOT_MIN=[null,475,530,585,670,725,780];
var S={admin:false,adminPass:"",code:"",needCode:false,loaded:false,err:"",
  tab:"reservar",team:null,config:{nextTeam:1},teams:{},teachers:{},bookings:[],prescriptions:{},settings:DEF_SET,
  rev:{config:0,teams:0,teachers:0,bookings:0,settings:0},
  name:"",btype:"E",tokens:{},lastBook:null,confirmBook:null,confirmCancel:null,weekOff:0,sd:null,scrollTop:false,scrollSel:false,
  editing:null,open:{},filter:"all",showPast:false,confirmDel:null,msg:"",msgKind:"ok",busy:false,
  bulkErr:[],noRestore:false,scrollEditor:false,
  keys:{},fk:null,fdata:null,fpass:{},fAsk:null,fErr:"",fnew:null,confirmKey:null,confirmDoc:null,confirmVal:null,showArch:false,fall:null,impErr:[],emailMode:false,emails:{},email:"",myTk:"",needName:false,ratings:[],ranking:[],rankOpen:false,rdraft:{},teamKeysSet:{},teamKeys:{},askTeam:null,tkErr:"",tnew:null};

var $app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return String(n).padStart(2,"0");}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function addDays(s,n){var p=s.split("-").map(Number);var d=new Date(p[0],p[1]-1,p[2]+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function fmtDate(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});}
function fmtShort(ms){return new Date(ms).toLocaleDateString("es-ES",{day:"numeric",month:"short"});}
function dayTag(s){var t=todayStr();return s===t?"Hoy":(s===addDays(t,1)?"Mañana":"");}
function tkeyOf(n){return String(n).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80)||"sin-nombre";}
var TYPE_RANK={V:0,E:1};
function cmp(a,b){
  return a.date.localeCompare(b.date)||(a.slot-b.slot)||((TYPE_RANK[a.type]||0)-(TYPE_RANK[b.type]||0))||((a.createdAt||0)-(b.createdAt||0))||String(a.id).localeCompare(String(b.id));
}
function typeName(t){return t==="V"?"Valoración":"Entrenamiento";}

/* ---------- Lógica de rotación (pura) ---------- */
function planAssign(bookings,teachers,ptr){
  var all=bookings.map(function(b){return Object.assign({},b);});
  var val={};Object.keys(teachers).forEach(function(k){val[k]=teachers[k].valTeam||null;});
  all.filter(function(b){return b.type==="V"&&b.team&&!b.subst;}).sort(cmp).forEach(function(b){if(!val[b.tkey])val[b.tkey]=b.team;});
  var load={};for(var t=1;t<=TEAMS;t++)load[t]=0;
  all.forEach(function(b){if(b.team)load[b.team]++;});
  var pend=all.filter(function(b){return !b.team;}).sort(cmp);
  var assign=[],vals=[];
  pend.forEach(function(b){
    var team=null;
    var busy={};
    all.forEach(function(x){if(x.team&&x.date===b.date&&x.slot===b.slot)busy[x.team]=1;});
    if(b.type==="V"&&val[b.tkey]&&!busy[val[b.tkey]]){team=val[b.tkey];}
    else{
      var best=null;
      for(var i=0;i<TEAMS;i++){
        var c=((ptr-1+i)%TEAMS)+1;
        if(busy[c])continue;
        if(best===null||load[c]<load[best])best=c;
      }
      if(best){team=best;ptr=best%TEAMS+1;}
      if(b.type==="V"&&team&&!val[b.tkey]){val[b.tkey]=team;vals.push({tkey:b.tkey,team:team});}
    }
    if(team){b.team=team;load[team]++;assign.push({id:b.id,team:team});}
  });
  return {assign:assign,vals:vals,ptr:ptr};
}

/* ---------- Datos (API en Netlify) ---------- */
function lsGet(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}}
function lsSet(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k)||"";}catch(e){return "";}}
function ssSet(k,v){try{if(v)sessionStorage.setItem(k,v);else sessionStorage.removeItem(k);}catch(e){}}
function loadTokens(){try{return JSON.parse(lsGet("monasfit.tokens")||"{}")||{};}catch(e){return {};}}
function saveTokens(){lsSet("monasfit.tokens",Object.keys(S.tokens).length?JSON.stringify(S.tokens):"");}
async function api(path,opts){
  opts=opts||{};
  var h={"content-type":opts.raw?"application/octet-stream":"application/json"};
  if(S.code)h["x-code"]=S.code;
  if(S.adminPass)h["x-admin"]=S.adminPass;
  if(S.team&&S.teamKeys[S.team])h["x-team-key"]=S.teamKeys[S.team];
  if(opts.headers)Object.keys(opts.headers).forEach(function(k){h[k]=opts.headers[k];});
  var r=await fetch("/api/"+path,{method:opts.method||"GET",headers:h,body:opts.raw?opts.raw:(opts.body?JSON.stringify(opts.body):undefined)});
  var data=null;try{data=await r.json();}catch(e){}
  if(!r.ok){var er=new Error((data&&data.error)||("Error "+r.status));er.status=r.status;er.data=data;throw er;}
  return data;
}
async function refresh(){
  try{
    var d=await api("state"+(S.team&&!S.admin?"?team="+S.team:""));
    S.needCode=false;S.err="";
    S.config=d.config.data||{nextTeam:1};S.teams=d.teams.data||{};S.teachers=d.teachers.data||{};S.bookings=d.bookings.data||[];S.prescriptions=d.prescriptions||{};S.keys=d.keys||{};S.emailMode=!!d.emailMode;S.emails=d.emails||{};S.ratings=d.ratings||[];S.ranking=d.ranking||[];S.teamKeysSet=d.teamKeysSet||{};
    if(!S.admin&&S.team&&S.teamKeysSet[S.team]&&!S.teamKeys[S.team]){S.askTeam=S.team;S.team=null;}
    S.settings=(d.settings&&d.settings.data)||DEF_SET;
    var ids={};S.bookings.forEach(function(b){ids[b.id]=1;});var ch=false;
    Object.keys(S.tokens).forEach(function(id){if(!ids[id]){delete S.tokens[id];ch=true;}});if(ch)saveTokens();
    S.rev={config:d.config.rev,teams:d.teams.rev,teachers:d.teachers.rev,bookings:d.bookings.rev,settings:d.settings?d.settings.rev:0};
  }catch(e){
    if(e.status===401&&e.data&&e.data.needCode){S.needCode=true;S.err=S.code?"Código incorrecto.":"";}
    else S.err="No se pudieron cargar los datos. Comprueba la conexión.";
  }
  S.loaded=true;
}
function collData(n){return n==="bookings"?S.bookings:n==="teachers"?S.teachers:n==="teams"?S.teams:n==="settings"?S.settings:S.config;}
async function saveColl(n){
  var r=await api("admin",{method:"POST",body:{key:n,baseRev:S.rev[n],value:collData(n)}});
  S.rev[n]=r.rev;
}
async function saveAll(names){for(var i=0;i<names.length;i++)await saveColl(names[i]);}
function newId(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function ensureTeacher(name){
  var k=tkeyOf(name);
  if(!S.teachers[k])S.teachers[k]={tkey:k,name:name.trim(),valTeam:null,course:courseNow(),archived:false};
  return k;
}
function applyPlan(){
  var plan=planAssign(S.bookings,S.teachers,Math.min(TEAMS,Math.max(1,Number(S.config.nextTeam)||1)));
  plan.vals.forEach(function(v){S.teachers[v.tkey].valTeam=v.team;});
  plan.assign.forEach(function(a){var b=S.bookings.filter(function(x){return x.id===a.id;})[0];if(b)b.team=a.team;});
  var dirty=[];
  if(plan.vals.length)dirty.push("teachers");
  if(plan.assign.length)dirty.push("bookings");
  if(plan.assign.length||plan.ptr!==S.config.nextTeam){S.config={nextTeam:plan.ptr,updatedAt:Date.now()};dirty.push("config");}
  return {n:plan.assign.length,dirty:dirty};
}
async function assignPending(){var r=applyPlan();await saveAll(r.dirty);return r.n;}
async function addBookings(items){
  var added=0,dup=0,dirty={};
  items.forEach(function(it){
    var before=Object.keys(S.teachers).length;
    var k=ensureTeacher(it.name);
    if(Object.keys(S.teachers).length>before)dirty.teachers=1;
    var exists=S.bookings.some(function(b){return b.tkey===k&&b.date===it.date&&b.slot===it.slot&&b.type===it.type;});
    if(exists){dup++;return;}
    S.bookings.push({id:newId(),date:it.date,slot:it.slot,type:it.type,teacher:S.teachers[k].name,tkey:k,team:null,createdAt:Date.now()+added});
    added++;dirty.bookings=1;
  });
  var r=applyPlan();
  r.dirty.forEach(function(n){dirty[n]=1;});
  await saveAll(["teachers","bookings","config"].filter(function(n){return dirty[n];}));
  return {added:added,dup:dup,assigned:r.n};
}

/* ---------- Fichas personales ---------- */
function courseNow(){var d=new Date(),y=d.getFullYear(),s0=d.getMonth()>=8?y:y-1;return s0+"-"+pad((s0+1)%100);}
function fHeaders(k){
  if(S.fpass[k])return {"x-tpass":S.fpass[k]};
  if(S.team&&!S.admin)return {"x-team":String(S.team)};
  return {};
}
function fSavePass(){ssSet("monasfit.fk",Object.keys(S.fpass).length?JSON.stringify(S.fpass):"");}
async function loadFicha(k){
  var r=await api("ficha?tkey="+encodeURIComponent(k),{headers:fHeaders(k)});
  S.fk=k;S.fdata=r;S.fAsk=null;S.fErr="";S.scrollTop=true;
}
function imc(v){return v.peso&&v.talla?(Math.round(v.peso/Math.pow(v.talla/100,2)*10)/10):null;}
function fmtNum(n,u){return n==null?"—":String(n).replace(".",",")+(u||"");}
function fmtSize(b){return b>=1048576?(Math.round(b/104857.6)/10)+" MB":Math.max(1,Math.round(b/1024))+" KB";}
var ENT_FIELDS=[["objetivo","Objetivo principal","Qué quiere conseguir con el proyecto"],["salud","Salud y antecedentes","Enfermedades, medicación, operaciones…"],["lesiones","Lesiones o molestias","Dolor de espalda, rodillas, hombros…"],["actividad","Actividad física actual","Qué hace ahora y con qué frecuencia"],["habitos","Hábitos","Sueño, alimentación, estrés, tabaco…"],["disponibilidad","Disponibilidad y material","Días y horas, gimnasio o casa"],["notas","Otras notas",""]];

/* ---------- Lectura de fechas y franjas ---------- */
function parseDate(t){
  var m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t);var y,mo,d;
  if(m){y=+m[1];mo=+m[2];d=+m[3];}
  else{m=/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/.exec(t);if(!m)return null;d=+m[1];mo=+m[2];y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;}
  var dt=new Date(y,mo-1,d);if(dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  return y+"-"+pad(mo)+"-"+pad(d);
}
function parseSlot(t){
  var s=String(t).trim().replace(/[ªº°\.]$/,"").replace(".",":");
  if(/^[1-6]$/.test(s))return +s;
  var m=/^(\d{1,2}):(\d{2})/.exec(s);if(m){var key=(+m[1])+":"+m[2];if(SLOT_START[key])return SLOT_START[key];}
  return null;
}
function parseBulk(text){
  var out=[],errs=[];
  text.split(/\r?\n/).map(function(l){return l.trim();}).forEach(function(line,i){
    if(!line)return;
    var p=line.split(/[;,\t]/).map(function(x){return x.trim();});
    if(p.length<4){errs.push("Línea "+(i+1)+": faltan datos (fecha, franja, profesor, tipo).");return;}
    var date=parseDate(p[0]),slot=parseSlot(p[1]),type=p[p.length-1].toUpperCase(),name=p.slice(2,p.length-1).join(", ");
    if(!date){errs.push("Línea "+(i+1)+": fecha no válida («"+p[0]+"»).");return;}
    if(!slot){errs.push("Línea "+(i+1)+": franja no válida («"+p[1]+"»). Usa 1 a 6 o la hora de inicio.");return;}
    if(type!=="E"&&type!=="V"){errs.push("Línea "+(i+1)+": el tipo debe ser E o V.");return;}
    if(!name){errs.push("Línea "+(i+1)+": falta el nombre del profesor.");return;}
    out.push({date:date,slot:slot,type:type,name:name});
  });
  return {items:out,errs:errs};
}

/* ---------- Permisos de vista ---------- */
/* ---- Valoración cada 4 semanas: cuenta atrás por profesor ---- */
var DUE_DAYS=28,DUE_WARN=7;
function daysBetween(a,b){var x=a.split("-").map(Number),y=b.split("-").map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/86400000);}
function shortDate(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("es-ES",{day:"numeric",month:"short"});}
function dueInfo(k){
  var today=todayStr();
  var vs=S.bookings.filter(function(b){return b.tkey===k&&b.type==="V"&&b.team;}).sort(function(a,b){return a.date<b.date?-1:1;});
  if(!vs.length)return null;
  var past=vs.filter(function(b){return b.date<=today;}),fut=vs.filter(function(b){return b.date>today;});
  var last=past.length?past[past.length-1].date:null,next=fut.length?fut[0].date:null;
  if(!last)return {state:"first",next:next};
  var due=addDays(last,DUE_DAYS),days=daysBetween(today,due);
  if(next&&next>=addDays(last,1))return {state:"booked",last:last,due:due,days:days,next:next};
  return {state:days<0?"late":(days<=DUE_WARN?"soon":"ok"),last:last,due:due,days:days};
}

  if(i.state==="late")return "Valoración retrasada "+(-i.days)+" día"+(i.days===-1?"":"s")+" (tocaba el "+shortDate(i.due)+")";
  if(i.days===0)return "Hoy toca la valoración";
  return "Próxima valoración en "+i.days+" día"+(i.days===1?"":"s")+" ("+shortDate(i.due)+")";
}

function mondayOf(s){var p=s.split("-").map(Number);var w=new Date(p[0],p[1]-1,p[2]).getDay();return addDays(s,w===0?-6:1-w);}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes();}
function fmtDay(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("es-ES",{day:"numeric",month:"long"});}
function bookDone(r){

    '<div class="big">'+(b.type==="V"?"Te valora el equipo ":"Te entrena el equipo ")+b.team+'</div>'+
    (r.members?'<p>'+esc(r.members)+'</p>':'')+
    (b.conf==="pending"?'<p class="small">⏳ El equipo tiene que confirmar la sesión. Si no puede, pasará automáticamente a otro equipo y verás el cambio en «Mis reservas».</p>':'')+
    (b.type==="V"?'<p class="small">Será normalmente este equipo quien te valore.</p>':'')+
    '<div class="row" style="margin-top:.6rem"><button class="btn sm" data-act="closeDone">Entendido</button></div></div>';
}
function wkTitle(base){
  var p=base.split("-").map(Number),a=new Date(p[0],p[1]-1,p[2]),f=addDays(base,4).split("-").map(Number),e=new Date(f[0],f[1]-1,f[2]);
  var m=function(d){return d.toLocaleDateString("es-ES",{month:"long"});};
  return "Semana del "+a.getDate()+(a.getMonth()!==e.getMonth()?" de "+m(a):"")+" al "+e.getDate()+" de "+m(e);
}
function wkShort(base){var p=base.split("-").map(Number),a=new Date(p[0],p[1]-1,p[2]),f=addDays(base,4).split("-").map(Number),e=new Date(f[0],f[1]-1,f[2]);var m=function(d){return d.toLocaleDateString("es-ES",{month:"short"}).replace(".","");};return a.getDate()+(a.getMonth()!==e.getMonth()?" "+m(a):"")+" – "+e.getDate()+" "+m(e);}
var DAYABB=["Lun","Mar","Mié","Jue","Vie"];
function cellInfo(d,s,wd,st,today,last,tk){
  var open=(st.open[wd]||[]).indexOf(s)>=0;
  var list=S.bookings.filter(function(b){return b.date===d&&b.slot===s;});
  var r={d:d,s:s,wd:wd,list:list,n:list.length,resp:st.resp[wd+"-"+s]||"",state:"na"};
  if(!open||d<today||d>last||st.closed.indexOf(d)>=0||st.closed.indexOf(d+"#"+s)>=0){r.state="na";return r;}
  if(d===today&&nowMin()>=SLOT_MIN[s]){r.state="past";return r;}
  if(tk&&list.some(function(b){return b.tkey===tk;})){r.mine=true;}
  r.state=r.n>=st.cap?"full":(r.n>0?"part":"free");
  return r;
}
function calCell(c,st){
  var cls="cell "+c.state+(c.mine?" mine":"")+((S.confirmBook&&S.confirmBook.date===c.d&&S.confirmBook.slot===c.s)?" sel":"");
  if(c.state==="na")return '<div class="'+cls+'" aria-label="No disponible"><span class="ct">'+'<span aria-hidden="true">⊘</span></span></div>';
  if(c.state==="past")return '<div class="'+cls+'"><span class="ct">Ya empezó</span></div>';
  var who=c.list.map(function(b){return esc(b.teacher)+' ('+b.type+')';}).join(", ");
  return '<button class="'+cls+'" data-act="pick" data-d="'+c.d+'" data-s="'+c.s+'" aria-label="'+esc(fmtDate(c.d))+', '+SLOTS[c.s]+', '+c.n+' de '+st.cap+' plazas'+(c.mine?', reservada por ti':'')+'">'+
    '<span class="cp">'+c.n+'/'+st.cap+'</span>'+(c.resp?'<span class="cr" title="Profesor responsable"><b class="cr-p">Prof. </b>'+esc(c.resp)+'</span>':'')+(who?'<span class="cn">'+who+'</span>':'')+
    (c.mine?'<span class="ct"><strong>Tuya</strong></span>':(c.state==="full"?'<span class="ct">Completa</span>':''))+'</button>';
}
function bookModal(st,today,last,tk){

  h+=(S.emailMode?

    '<label for="bk-name" style="margin-top:.2rem">Tu nombre</label><input id="bk-name" data-keep data-change="bkname" autocomplete="off" value="'+esc(S.name)+'" placeholder="Por ejemplo: Laura J."><p class="muted small" style="margin:.3rem 0 0">Escríbelo siempre igual, para que se reconozca tu equipo de valoración.</p>')+
    '<label>¿Qué necesitas?</label><div class="filters">'+
    '<button class="chip" data-act="btype" data-t="V" aria-pressed="'+(S.btype==="V")+'">Valoración (V)</button>'+
    '<button class="chip" data-act="btype" data-t="E" aria-pressed="'+(S.btype==="E")+'">Entrenamiento (E)</button></div>'+
    '<p class="muted small" style="margin:.4rem 0 .7rem">'+(S.btype==="V"?"La valoración de tu composición corporal la hace siempre el mismo equipo. Si ya te valoraron, volverá a ser ese equipo.":"El entrenamiento guiado va rotando entre los equipos. Al reservar verás cuál te toca.")+'</p>'+
    '<div class="row"><button class="btn cta" data-act="doBook"'+(S.busy?" disabled":"")+'>'+(S.btype==="V"?"Reservar valoración":"Reservar entrenamiento")+'</button><button class="btn" data-act="noBook">Cancelar</button></div></div></div>';
  return h;

function vReservar(){
  var st=S.settings||DEF_SET,today=todayStr(),last=addDays(today,st.horizon);
  var base=mondayOf(addDays(today,S.weekOff*7));
  var tk=S.emailMode?(S.email&&S.myTk?S.myTk:""):(S.name.trim().length>=2?tkeyOf(S.name):"");
  var html='<div class="rv-top"><h2>Reserva tu hora</h2><div class="wk"><button class="btn sm" data-act="wkPrev" aria-label="Semana anterior"'+(S.weekOff>0?"":" disabled")+'>←</button><strong class="wkt">'+esc(wkShort(base))+'</strong>'+
    '<button class="btn sm" data-act="wkNext" aria-label="Semana siguiente"'+(addDays(base,7)<=last?"":" disabled")+'>→</button></div></div>';
  var g='<div class="cal rv" role="group" aria-label="Calendario semanal. Toca una franja libre para reservar"><div></div>';

        '<div class="small muted">'+SLOTS[b.slot]+' · '+(b.team?'Equipo '+b.team+(membersOf(b.team)?' · '+esc(membersOf(b.team)):'')+(isPend(b)?' · <span class="pendchip">⏳ pendiente de confirmar</span>':' · <span class="okchip">✓ confirmado</span>'):'Buscando equipo…')+'</div></div>'+
        '<div class="row">'+(can?(S.confirmCancel===b.id?'<button class="btn sm danger" data-act="doCancel" data-id="'+esc(b.id)+'"'+(S.busy?" disabled":"")+'>Sí, cancelar</button><button class="btn sm" data-act="noCancel">No</button>':'<button class="btn sm" data-act="askCancel" data-id="'+esc(b.id)+'">Cancelar</button>'):'')+'</div></div>';
    });

  }

function render(){
  var saved={},act=document.activeElement,fid=act&&act.id,ss=null,se=null,restore=!S.noRestore;

  $app.querySelectorAll("[data-keep]").forEach(function(el){if(el.id)saved[el.id]=el.value;});
  if(act&&typeof act.selectionStart==="number"){try{ss=act.selectionStart;se=act.selectionEnd;}catch(e){}}
  $app.innerHTML=view();
  if(restore){
    Object.keys(saved).forEach(function(id){var el=document.getElementById(id);if(el&&el.hasAttribute("data-keep"))el.value=saved[id];});
    if(fid){var f=document.getElementById(fid);if(f){try{f.focus({preventScroll:true});if(ss!=null&&f.setSelectionRange)f.setSelectionRange(ss,se);}catch(e){}}}

  if(S.scrollSel){S.scrollSel=false;var sp=document.getElementById("selPanel");if(sp)sp.scrollIntoView({block:"nearest",behavior:"smooth"});}

var msgTimer=null;

  S.msg=text;S.msgKind=kind||"ok";clearTimeout(msgTimer);

function logoutAdmin(){S.admin=false;S.adminPass="";ssSet("monasfit.admin","");if(S.tab==="gestion")S.tab="reservar";}
async function run(fn,okMsg){
  if(S.busy)return;
  S.busy=true;render();
  var failed=false;
  try{var r=await fn();say(typeof okMsg==="function"?okMsg(r):(okMsg||""),"ok");}
  catch(e){
    failed=true;
    if(e.status===409)say("Otra persona cambió los datos a la vez. Se han recargado: repite la acción.","err");
    else if(e.status===403&&S.admin){logoutAdmin();say("La sesión de coordinación ha caducado. Entra de nuevo.","err");}
    else if(e.status===401||e.status===403||e.status===422||e.status===503)say(e.message,"err");
    else say("No se pudo guardar. "+(e.message||"Inténtalo de nuevo."),"err");
  }
  if(failed)await refresh();
  S.busy=false;render();
}

    var ta=document.getElementById("fall-txt");if(!ta)return;
    var done=function(){say("Lista copiada.","ok");render();};
    var fb=function(){ta.focus();ta.select();try{document.execCommand("copy");}catch(e){}say("Si no se ha copiado, selecciona el texto y cópialo a mano.","ok");render();};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,fb);}else fb();
  },
  fAllOk:function(){S.fall=null;render();},
  addTeacher:function(){
    var nm=val("nt-name").trim().replace(/\s+/g," "),em=val("nt-email").trim(),co=val("nt-course").trim()||courseNow();
    if(nm.length<2){say("Escribe el nombre del profesor.","err");render();return;}
    if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){say("El correo no es válido.","err");render();return;}
    run(async function(){
      var r=await api("import-teachers",{method:"POST",body:{items:[{name:nm,email:em,team:null}]}});
      if(r.errors&&r.errors.length)throw new Error(r.errors[0]);
      await refresh();
      var k=tkeyOf(nm);if(S.teachers[k]&&co!==S.teachers[k].course){S.teachers[k].course=co;await saveColl("teachers");}
      S.noRestore=true;
    },"Profesor añadido.");
  },
  tArch:function(d){
    run(async function(){var t=S.teachers[d.k];if(t){t.archived=!t.archived;if(!t.archived&&!t.course)t.course=courseNow();}await saveColl("teachers");},"Profesorado actualizado.");
  },
  archiveOld:function(){
    var cur=courseNow(),n=0;
    run(async function(){Object.keys(S.teachers).forEach(function(k){var t=S.teachers[k];if(!t.archived&&(t.course||"")!==cur){t.archived=true;n++;}});await saveColl("teachers");return n;},function(c){return c+" profesor"+(c===1?"":"es")+" archivado"+(c===1?"":"s")+".";});
  },
  del:function(d){S.confirmDel=d.id;render();},
  delNo:function(){S.confirmDel=null;render();},
  delYes:function(d){
    run(async function(){S.bookings=S.bookings.filter(function(b){return b.id!==d.id;});S.confirmDel=null;await saveColl("bookings");},"Reserva borrada.");
  }
};
var changes={
  bkemail:function(el){var v=el.value.trim().toLowerCase();if(v!==S.email){S.needName=false;S.email=v;S.myTk="";lsSet("monasfit.email",v);lsSet("monasfit.tkey","");}},
  tEmail:function(el){
    var k=el.dataset.k,v=el.value.trim();
    run(async function(){await api("teacher-email",{method:"POST",body:{tkey:k,email:v}});await refresh();},v?"Correo guardado.":"Correo quitado.");
  },
  bkname:function(el){S.name=el.value.trim().replace(/\s+/g," ");lsSet("monasfit.name",S.name);},
  sdCap:function(el){sdGet().cap=Number(el.value);render();},
  sdWeeks:function(el){sdGet().horizon=Number(el.value)*7;render();},
  sdOpen:function(el){
    var sd=sdGet(),d=el.dataset.d,sl=Number(el.dataset.s),a=(sd.open[d]||[]).filter(function(x){return x!==sl;});
    if(el.checked)a.push(sl);a.sort(function(x,y){return x-y;});sd.open[d]=a;render();
  },
  team:function(el){if(S.fdata&&S.fdata.role!=="key"&&S.fdata.role!=="admin"){S.fk=null;S.fdata=null;}chooseTeam(el.value?Number(el.value):null);},
  tCourse:function(el){var k=el.dataset.k,v=el.value.trim().slice(0,12);run(async function(){if(S.teachers[k])S.teachers[k].course=v;await saveColl("teachers");},"Curso actualizado.");},
  fdoc:function(el){
    var f=el.files&&el.files[0],k=S.fk;if(!f||!k)return;
    var cat=val("fdoc-cat");
    if(!cat){el.value="";say("Elige primero el tipo de documento (valoración corporal, PAR-Q o prescripción).","err");render();return;}
    if(f.size>4*1024*1024){el.value="";say("El archivo pesa más de 4 MB.","err");render();return;}
    run(async function(){
      var buf=await f.arrayBuffer();
      var r=await api("doc?tkey="+encodeURIComponent(k)+"&cat="+encodeURIComponent(cat)+"&name="+encodeURIComponent(f.name),{method:"POST",headers:fHeaders(k),raw:buf});
      S.fdata.ficha=r.ficha;S.noRestore=true;
    },"Documento subido.");
  },
  docCat:function(el){var k=S.fk,id=el.dataset.id,c=el.value;if(!c){render();return;}run(async function(){var r=await api("doc-cat",{method:"POST",headers:fHeaders(k),body:{tkey:k,id:id,cat:c}});S.fdata.ficha=r.ficha;S.noRestore=true;},"Tipo de documento cambiado.");},
  next:function(el){var n=Number(el.value)||1;run(async function(){S.config={nextTeam:n,updatedAt:Date.now()};await saveColl("config");},"Próximo equipo actualizado.");},
  bteam:function(el){var id=el.dataset.id,t=el.value?Number(el.value):null;run(async function(){var b=S.bookings.filter(function(x){return x.id===id;})[0];if(b){b.team=t;b.conf=undefined;b.dueAt=undefined;b.subst=undefined;}await saveColl("bookings");},"Equipo actualizado.");},
  valTeam:function(el){var k=el.dataset.k,t=el.value?Number(el.value):null;run(async function(){if(S.teachers[k])S.teachers[k].valTeam=t;await saveColl("teachers");},"Equipo de valoración actualizado.");}
};
(function(){
  var sx=0,sy=0,st0=0,on=false;
  $app.addEventListener("touchstart",function(e){
    var c=e.target.closest&&e.target.closest(".cal.rv");
    if(!c||e.touches.length!==1||S.confirmBook||S.lastBook){on=false;return;}
    on=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st0=Date.now();
  },{passive:true});
  $app.addEventListener("touchend",function(e){
    if(!on)return;on=false;
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5||Date.now()-st0>700)return;
    var stg=S.settings||DEF_SET,td=todayStr(),last=addDays(td,stg.horizon),base=mondayOf(addDays(td,S.weekOff*7));
    if(dx<0){if(addDays(base,7)<=last)actions.wkNext();}
    else if(S.weekOff>0)actions.wkPrev();
    S.swiped=Date.now();
  },{passive:true});
})();
$app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  if(b.classList.contains("sheet-bg")&&e.target!==b)return;
  var f=actions[b.dataset.act];if(f)f(b.dataset);
});
document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;if(S.rankOpen){S.rankOpen=false;S.noRestore=true;render();}else if(S.confirmBook){S.confirmBook=null;render();}});
$app.addEventListener("change",function(e){
  var el=e.target;if(!el.dataset||!el.dataset.change)return;
  var f=changes[el.dataset.change];if(f)f(el);
});
$app.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  if(e.target.id==="code-in")actions.enterCode();
  else if(e.target.id==="adm-pass")actions.login();
  else if(e.target.id==="fk-in")actions.fLogin({k:e.target.dataset.k});
});
function readHash(){
  var h=(location.hash||"").slice(1);
  if(TABS.some(function(t){return t[0]===h;})){S.tab=h;}
}
window.addEventListener("hashchange",function(){readHash();render();window.scrollTo(0,0);});

async function init(){
  S.code=lsGet("monasfit.code");S.name=lsGet("monasfit.name");S.email=lsGet("monasfit.email");S.myTk=lsGet("monasfit.tkey");S.tokens=loadTokens();
  var t=lsGet("monasfit.team");if(t)S.team=Number(t)||null;
  try{S.teamKeys=JSON.parse(lsGet("monasfit.teamkeys")||"{}")||{};}catch(e){S.teamKeys={};}
  S.adminPass=ssGet("monasfit.admin");
  try{S.fpass=JSON.parse(ssGet("monasfit.fk")||"{}")||{};}catch(e){S.fpass={};}
  readHash();render();
  if(S.adminPass){try{await api("admin-check");S.admin=true;}catch(e){S.adminPass="";S.admin=false;ssSet("monasfit.admin","");}}
  await refresh();
  render();
  // Se actualiza solo con la pestaña visible y sin abusar del servidor (cada 2 minutos como mucho).
  var last=Date.now();
  function tick(){if(document.hidden||S.busy||S.needCode||!S.loaded||Date.now()-last<60000)return;last=Date.now();refresh().then(render);}
  setInterval(tick,120000);
  document.addEventListener("visibilitychange",tick);
}
init();
})();
</script>
